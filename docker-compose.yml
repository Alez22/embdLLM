services:
  embedeval:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # See embedeval-nxp: run as the host user so results/ stays user-owned.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./cases:/app/cases:ro
      - ./results:/app/results
    environment:
      - ZEPHYR_BASE=/opt/zephyrproject/zephyr
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.16.8
      - BSIM_OUT_PATH=/opt/bsim
      - EMBEDEVAL_ENABLE_BUILD=1

  embedeval-nxp:
    build:
      context: .
      dockerfile: docker/Dockerfile.nxp
    # Run as the host user so files written to the results/ mount are not
    # root-owned (root-owned results break git checkout/merge on the host).
    # UID/GID come from the environment or .env; 1000:1000 is the common
    # single-user Linux default. The TUI overrides this with the real ids.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./cases:/app/cases:ro
      - ./results:/app/results
    environment:
      - NXP_SDK_PATH=/opt/nxp-sdk
      - EMBEDEVAL_ENABLE_BUILD=1

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # See embedeval-nxp: run as the host user so results/ stays user-owned.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./cases:/app/cases:ro
      - ./results:/app/results
    environment:
      - ZEPHYR_BASE=/opt/zephyrproject/zephyr
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.16.8
      - BSIM_OUT_PATH=/opt/bsim
      - EMBEDEVAL_ENABLE_BUILD=1
    deploy:
      replicas: 4
    entrypoint: ["uv", "run", "embedeval"]
